# XcodeGen spec: run `xcodegen generate` in this directory after adding or
# removing source files to regenerate AstroHopper.xcodeproj.
name: AstroHopper
options:
  bundleIdPrefix: org.davemercer
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  # Marks the project as upgraded to Xcode 27's recommended settings.
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.11"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 439DFSB44F
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  AstroHopper:
    type: application
    platform: iOS
    sources:
      - path: AstroHopper
        excludes:
          - Generated
      # Generated by Tools/generate_data.py (pre-build script below); not in git.
      - path: AstroHopper/Generated/catalog.json
        optional: true
        buildPhase: resources
      - path: AstroHopper/Generated/vsop87a.json
        optional: true
        buildPhase: resources
    preBuildScripts:
      - name: Generate star catalog and planet data
        basedOnDependencyAnalysis: true
        script: |
          python3 "${SRCROOT}/Tools/generate_data.py" "${SRCROOT}/AstroHopper/Generated"
        inputFiles:
          - $(SRCROOT)/Tools/generate_data.py
          - $(SRCROOT)/../create_data.py
          - $(SRCROOT)/../vsop87a_combined.js
          - $(SRCROOT)/../OpenNGC/NGC.csv
          - $(SRCROOT)/../western_constellations_atlas_of_space/data/hygdata_v3/hygdata_v3.csv
          - $(SRCROOT)/../western_constellations_atlas_of_space/data/processed/centered_constellations.csv
          - $(SRCROOT)/../western_constellations_atlas_of_space/data/stellarium_western_asterisms/constellationship.fab
        outputFiles:
          - $(SRCROOT)/AstroHopper/Generated/catalog.json
          - $(SRCROOT)/AstroHopper/Generated/vsop87a.json
    info:
      path: AstroHopper/Info.plist
      properties:
        CFBundleDisplayName: AstroHopper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: AstroHopper uses your location to compute where stars and planets are in your sky.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davemercer.AstroHopper
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
  AstroHopperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AstroHopperTests
    dependencies:
      - target: AstroHopper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.davemercer.AstroHopperTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AstroHopper.app/AstroHopper
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  AstroHopper:
    build:
      targets:
        AstroHopper: all
        AstroHopperTests: [test]
    test:
      targets:
        - AstroHopperTests
